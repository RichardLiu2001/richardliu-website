{{- /* Game state machine. Context: dict "arrow" (unique marker id) "interactive" (bool: boxes that contain a lower level are clickable). */ -}}
<svg viewBox="0 0 800 250" role="img" aria-label="Game state machine">
  <defs>
    <marker id="{{ .arrow }}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="sc-arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>


  <!-- start -->
  <circle class="sc-start" cx="24" cy="110" r="6"/>
  <text class="sc-upd" x="14" y="160">inning = 1, score 0–0</text>
  <path class="sc-edge" d="M30 110 H50" marker-end="url(#{{ .arrow }})"/>

  <!-- Top of inning (contains a half inning) -->
  <g {{ if .interactive }}class="sc-child" data-target="sc-half" role="button" tabindex="0" aria-expanded="false"{{ else }}class="sc-node"{{ end }}>
    <rect x="50" y="85" width="150" height="50" rx="6"/>
    <text x="125" y="106" text-anchor="middle">Top of inning {{ if .interactive }}<tspan class="sc-caret">▸</tspan>{{ end }}</text>
    <text class="sc-small" x="125" y="124" text-anchor="middle">away team bats</text>
  </g>

  <!-- Top → Bottom -->
  <path class="sc-edge" d="M200 110 H438" marker-end="url(#{{ .arrow }})"/>
  <text class="sc-cond" x="319" y="102" text-anchor="middle">3 outs [otherwise]</text>

  <!-- Bottom of inning (contains a half inning) -->
  <g {{ if .interactive }}class="sc-child" data-target="sc-half" role="button" tabindex="0" aria-expanded="false"{{ else }}class="sc-node"{{ end }}>
    <rect x="440" y="85" width="150" height="50" rx="6"/>
    <text x="515" y="106" text-anchor="middle">Bottom of inning {{ if .interactive }}<tspan class="sc-caret">▸</tspan>{{ end }}</text>
    <text class="sc-small" x="515" y="124" text-anchor="middle">home team bats</text>
  </g>

  <!-- Bottom → next inning -->
  <path class="sc-edge" d="M515 85 V36 H125 V83" marker-end="url(#{{ .arrow }})"/>
  <text class="sc-cond" x="320" y="28" text-anchor="middle">3 outs [otherwise]</text>
  <text class="sc-upd" x="320" y="52" text-anchor="middle">inning += 1</text>

  <!-- endings -->
  <g class="sc-term"><rect x="300" y="200" width="130" height="34" rx="17"/>
    <text x="365" y="221" text-anchor="middle">HOME WINS</text></g>
  <g class="sc-term"><rect x="655" y="200" width="130" height="34" rx="17"/>
    <text x="720" y="221" text-anchor="middle">AWAY WINS</text></g>

  <path class="sc-edge" d="M175 135 V217 H298" marker-end="url(#{{ .arrow }})"/>
  <text class="sc-cond" x="183" y="180">3 outs [9th+ &amp; home leads]</text>
  <path class="sc-edge" d="M515 135 V217 H432" marker-end="url(#{{ .arrow }})"/>
  <text class="sc-cond" x="523" y="180">walk-off</text>
  <path class="sc-edge" d="M590 110 H720 V198" marker-end="url(#{{ .arrow }})"/>
  <text class="sc-cond" x="598" y="102">3 outs [9th+ &amp; away leads]</text>
</svg>
