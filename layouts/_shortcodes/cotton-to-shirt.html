{{- /*
  Animated story: cotton plant → fibers → yarn → woven fabric → shirt.
  Usage in a post: {{< cotton-to-shirt >}}
  Each scene has a build() that draws it once and a render(p) that poses it at progress p (0 to 1).
*/ -}}
<style>
  .cs-root {
    --cs-stem: #4f7d3a;
    --cs-leaf: #6a9a4b;
    --cs-bract: #7a5230;
    --cs-cotton: #ffffff;
    --cs-cotton-edge: #c9c2b4;
    --cs-fiber: #b9ae98;
    --cs-yarn: #f3eee2;
    --cs-yarn-stripe: #cfc4ad;
    --cs-warp: #d9cfba;
    --cs-weft: #f7f3ea;
    --cs-fabric: #f1ebdd;
    --cs-edge: rgba(0, 0, 0, 0.35);
    --cs-wood: #b08a5a;
    --cs-soil: #8b6b4a;
    --cs-cut: #5b4636;
    width: min(var(--wide-width, 1100px), 100vw - 2 * var(--gap));
    margin: 0 0 var(--content-gap) 50%;
    transform: translateX(-50%);
  }
  :root[data-theme="dark"] .cs-root {
    --cs-stem: #6fa452;
    --cs-leaf: #82b562;
    --cs-bract: #a0714a;
    --cs-cotton: #f4f1ea;
    --cs-cotton-edge: #8f887b;
    --cs-fiber: #d6cdb9;
    --cs-yarn: #e9e2d2;
    --cs-yarn-stripe: #b3a78e;
    --cs-warp: #c9bfa9;
    --cs-weft: #ece6d8;
    --cs-fabric: #e3dccb;
    --cs-edge: rgba(0, 0, 0, 0.6);
    --cs-wood: #c49d6b;
    --cs-soil: #9c7c5a;
  }
  .cs-root svg { display: block; width: 100%; max-width: 820px; height: auto; margin: 0 auto; border-radius: 10px; background: var(--code-bg); }
  .cs-root svg text { fill: var(--secondary); font-size: 13px; }
  .cs-scene { transition: opacity .35s ease; }
  .cs-steps { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 6px; }
  .cs-root button {
    font: inherit; font-size: 14px; cursor: pointer; color: var(--primary); background: var(--entry);
    border: 1px solid var(--tertiary); border-radius: 999px; padding: 4px 14px;
  }
  .cs-steps button { position: relative; overflow: hidden; min-width: 96px; }
  .cs-steps button[aria-current="step"] { border-color: var(--primary); font-weight: 600; }
  .cs-steps .cs-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--primary); opacity: .6; }
  .cs-caption { text-align: center; font-size: 15px; color: var(--primary); min-height: 3em; margin: 6px auto 0; max-width: 640px; }
  .cs-controls { display: flex; justify-content: center; margin-top: 4px; }
</style>

<div class="cs-root">
  <svg viewBox="0 0 800 360" role="img" aria-label="Animation: cotton fiber from the plant, spun into yarn, woven into fabric, and sewn into a shirt"></svg>
  <div class="cs-steps"></div>
  <p class="cs-caption" aria-live="polite"></p>
  <div class="cs-controls"><button type="button" data-cs-play>Play</button></div>
</div>

<script>
  (() => {
    const root = document.currentScript.previousElementSibling;
    const svg = root.querySelector('svg');
    const NS = 'http://www.w3.org/2000/svg';
    const uid = 'cs' + Math.random().toString(36).slice(2, 8);

    const el = (tag, attrs = {}, parent = svg) => {
      const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      parent.appendChild(e);
      return e;
    };
    const clamp = (x) => Math.max(0, Math.min(1, x));
    const seg = (p, a, b) => clamp((p - a) / (b - a));             // progress within [a, b]
    const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2);
    const lerp = (a, b, t) => a + (b - a) * t;
    let seed = 7;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

    const defs = el('defs');
    // Diagonal stripes that slide along the yarn to show its twist
    const twist = el('pattern', { id: uid + '-twist', width: 10, height: 20, patternUnits: 'userSpaceOnUse', patternTransform: 'skewX(-35)' }, defs);
    el('rect', { width: 10, height: 20, fill: 'var(--cs-yarn)' }, twist);
    el('rect', { width: 4, height: 20, fill: 'var(--cs-yarn-stripe)' }, twist);
    // Fine crosshatch for woven fabric
    const cloth = el('pattern', { id: uid + '-cloth', width: 6, height: 6, patternUnits: 'userSpaceOnUse' }, defs);
    el('rect', { width: 6, height: 6, fill: 'var(--cs-fabric)' }, cloth);
    el('path', { d: 'M0 3 H6 M3 0 V6', stroke: 'var(--cs-edge)', 'stroke-width': 0.4, opacity: 0.5 }, cloth);

    const fiberPath = 'M0 0 c 6 -5 12 5 18 0 s 12 5 18 0 s 12 -5 18 0 s 10 4 14 0';

    // ---- Scene 1: plant → boll opens → fibers ----
    const plant = {
      build(g) {
        el('ellipse', { cx: 210, cy: 322, rx: 90, ry: 9, fill: 'var(--cs-soil)', opacity: 0.5 }, g);
        this.stem = el('path', { d: 'M210 320 C 205 280, 214 230, 210 168', fill: 'none', stroke: 'var(--cs-stem)', 'stroke-width': 5, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': '1 1' }, g);
        this.leaves = [
          { d: 'M208 262 C 185 245, 160 250, 150 262 C 165 275, 190 275, 208 262 Z', ox: 208, oy: 262 },
          { d: 'M211 225 C 235 208, 262 212, 272 225 C 258 238, 232 238, 211 225 Z', ox: 211, oy: 225 },
        ].map((l) => ({ ...l, node: el('path', { d: l.d, fill: 'var(--cs-leaf)' }, g) }));
        this.bracts = [-70, -25, 25, 70].map((angle) => ({
          angle, node: el('path', { d: 'M210 168 C 196 150, 196 128, 210 116 C 224 128, 224 150, 210 168 Z', fill: 'var(--cs-bract)', stroke: 'var(--cs-edge)', 'stroke-width': 0.6 }, g),
        }));
        this.puff = el('g', {}, g);
        [[210, 128, 18], [193, 138, 14], [227, 138, 14], [199, 119, 12], [221, 119, 12], [210, 147, 13]].forEach(([cx, cy, r]) =>
          el('circle', { cx, cy, r, fill: 'var(--cs-cotton)', stroke: 'var(--cs-cotton-edge)', 'stroke-width': 1 }, this.puff));
        this.fibers = Array.from({ length: 9 }, (_, i) => ({
          from: [205 + rand() * 12, 128 + rand() * 16, rand() * 360],
          to: [440 + (i % 3) * 70 + rand() * 20, 110 + Math.floor(i / 3) * 60 + rand() * 20, rand() * 50 - 25],
          node: el('path', { d: fiberPath, fill: 'none', stroke: 'var(--cs-fiber)', 'stroke-width': 2.5, 'stroke-linecap': 'round' }, g),
        }));
        this.label = el('text', { x: 545, y: 82, 'text-anchor': 'middle' }, g);
        this.label.textContent = 'cotton fibers (magnified)';
        this.ring = el('rect', { x: 420, y: 92, width: 250, height: 200, rx: 18, fill: 'none', stroke: 'var(--secondary)', 'stroke-dasharray': '4 4' }, g);
      },
      render(p) {
        this.stem.setAttribute('stroke-dashoffset', 1 - ease(seg(p, 0, 0.18)));
        this.leaves.forEach((l, i) => {
          const s = ease(seg(p, 0.1 + i * 0.05, 0.25 + i * 0.05));
          l.node.setAttribute('transform', `translate(${l.ox} ${l.oy}) scale(${s}) translate(${-l.ox} ${-l.oy})`);
        });
        const grow = ease(seg(p, 0.18, 0.28)), open = ease(seg(p, 0.3, 0.5));
        this.bracts.forEach((b) => b.node.setAttribute('transform',
          `translate(210 168) scale(${grow}) rotate(${b.angle * open}) translate(-210 -168)`));
        const puff = ease(seg(p, 0.36, 0.56));
        this.puff.setAttribute('transform', `translate(210 140) scale(${puff}) translate(-210 -140)`);
        this.fibers.forEach((f, i) => {
          const t = ease(seg(p, 0.58 + i * 0.02, 0.85 + i * 0.015));
          const [x, y, r] = [0, 1, 2].map((k) => lerp(f.from[k], f.to[k], t));
          f.node.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${lerp(0.25, 1, t)})`);
          f.node.style.opacity = t > 0 ? 1 : 0;
        });
        const late = seg(p, 0.8, 0.92);
        this.label.style.opacity = late;
        this.ring.style.opacity = late;
      },
    };

    // ---- Scene 2: fibers twist into yarn and wind onto a bobbin ----
    const spin = {
      build(g) {
        this.fibers = Array.from({ length: 9 }, (_, i) => ({
          from: [70 + (i % 3) * 70 + rand() * 20, 100 + Math.floor(i / 3) * 60 + rand() * 20, rand() * 50 - 25],
          node: el('path', { d: fiberPath, fill: 'none', stroke: 'var(--cs-fiber)', 'stroke-width': 2.5, 'stroke-linecap': 'round' }, g),
        }));
        this.yarn = el('rect', { x: 290, y: 171, width: 0, height: 18, rx: 9, fill: `url(#${uid}-twist)`, stroke: 'var(--cs-edge)', 'stroke-width': 0.8 }, g);
        // Bobbin
        el('rect', { x: 664, y: 112, width: 52, height: 136, rx: 3, fill: 'var(--cs-wood)' }, g);
        this.wound = el('rect', { x: 662, y: 180, width: 56, height: 0, rx: 6, fill: `url(#${uid}-twist)`, stroke: 'var(--cs-edge)', 'stroke-width': 0.8 }, g);
        el('rect', { x: 652, y: 104, width: 76, height: 10, rx: 3, fill: 'var(--cs-wood)', stroke: 'var(--cs-edge)', 'stroke-width': 0.6 }, g);
        el('rect', { x: 652, y: 246, width: 76, height: 10, rx: 3, fill: 'var(--cs-wood)', stroke: 'var(--cs-edge)', 'stroke-width': 0.6 }, g);
        this.twistPattern = twist;
        const t = el('text', { x: 450, y: 150, 'text-anchor': 'middle' }, g);
        t.textContent = 'spinning: overlap and twist';
        this.label = t;
      },
      render(p) {
        this.fibers.forEach((f) => {
          const t = ease(seg(p, 0, 0.4));
          const x = lerp(f.from[0], 250, t), y = lerp(f.from[1], 176, t), r = lerp(f.from[2], 0, t);
          f.node.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(1 ${lerp(1, 0.4, t)})`);
          f.node.style.opacity = 1 - seg(p, 0.35, 0.5);
        });
        this.yarn.setAttribute('width', 374 * ease(seg(p, 0.3, 0.72)));
        const h = 124 * ease(seg(p, 0.72, 1));
        this.wound.setAttribute('height', h);
        this.wound.setAttribute('y', 180 - h / 2);
        this.twistPattern.setAttribute('patternTransform', `translate(${p * 160} 0) skewX(-35)`);
        this.label.style.opacity = seg(p, 0.35, 0.5);
      },
    };

    // ---- Scene 3: weaving ----
    const weave = {
      build(g) {
        const N = 12, S = 20, T = 15, X = 300, Y = 60, PAD = (S - T) / 2;
        this.N = N; this.S = S; this.X = X;
        this.warps = Array.from({ length: N }, (_, j) =>
          el('rect', { x: X + j * S + PAD, y: Y, width: T, height: 0, fill: 'var(--cs-warp)', stroke: 'var(--cs-edge)', 'stroke-width': 0.6 }, g));
        this.rows = Array.from({ length: N }, (_, i) => {
          const rg = el('g', {}, g);
          const weft = el('rect', { x: X, y: Y + i * S + PAD, width: 0, height: T, fill: 'var(--cs-weft)', stroke: 'var(--cs-edge)', 'stroke-width': 0.6 }, rg);
          const overs = [];
          for (let j = 0; j < N; j++) if ((i + j) % 2 === 0)
            overs.push({ j, node: el('rect', { x: X + j * S + PAD, y: Y + i * S - 1.5, width: T, height: S + 3, rx: 2, fill: 'var(--cs-warp)', stroke: 'var(--cs-edge)', 'stroke-width': 0.6 }, rg) });
          return { weft, overs, rtl: i % 2 === 1, y: Y + i * S + S / 2 };
        });
        this.shuttle = el('path', { d: 'M-22 0 Q-10 -8 0 -8 L14 -8 Q22 -4 26 0 Q22 4 14 8 L0 8 Q-10 8 -22 0 Z', fill: 'var(--cs-wood)', stroke: 'var(--cs-edge)', 'stroke-width': 0.8 }, g);
        const warpLabel = el('text', { x: X + (N * S) / 2, y: 48, 'text-anchor': 'middle' }, g);
        warpLabel.textContent = 'warp (lengthwise)';
        const weftLabel = el('text', { x: X - 16, y: Y + (N * S) / 2 + 4, 'text-anchor': 'end' }, g);
        weftLabel.textContent = 'weft (crosswise) →';
      },
      render(p) {
        const { N, S, X } = this, W = N * S;
        this.warps.forEach((w, j) => w.setAttribute('height', W * ease(seg(p, j * 0.008, 0.12 + j * 0.008))));
        const rowsT = seg(p, 0.16, 0.96) * N;
        let shuttle = null;
        this.rows.forEach((r, i) => {
          const q = clamp(rowsT - i), w = W * q;
          r.weft.setAttribute('width', w);
          r.weft.setAttribute('x', r.rtl ? X + W - w : X);
          r.weft.style.display = q > 0 ? '' : 'none';
          r.overs.forEach(({ j, node }) => {
            const start = r.rtl ? W - (j + 1) * S : j * S;
            node.style.display = w > start + S / 2 ? '' : 'none';
          });
          if (q > 0 && q < 1) shuttle = { x: r.rtl ? X + W - w : X + w, y: r.y, rtl: r.rtl };
        });
        this.shuttle.style.display = shuttle ? '' : 'none';
        if (shuttle) this.shuttle.setAttribute('transform', `translate(${shuttle.x} ${shuttle.y}) scale(${shuttle.rtl ? -1 : 1} 1)`);
      },
    };

    // ---- Scene 4: cut pattern pieces, assemble, stitch ----
    const sew = {
      build(g) {
        this.fabric = el('rect', { x: 60, y: 50, width: 300, height: 260, rx: 4, fill: `url(#${uid}-cloth)`, stroke: 'var(--cs-edge)', 'stroke-width': 0.8 }, g);
        // Final shirt geometry (centered at x = 580); dx/dy place each piece on the fabric before it moves.
        const PIECES = [
          { d: 'M525 90 L635 90 L642 300 L518 300 Z', dx: -438, dy: -20 },                          // body
          { d: 'M525 90 L470 110 L450 205 L490 213 L522 140 Z', dx: -220, dy: -30 },               // left sleeve
          { d: 'M635 90 L690 110 L710 205 L670 213 L638 140 Z', dx: -405, dy: 95 },                // right sleeve
          { d: 'M560 86 L580 100 L575 120 L550 101 Z', dx: -232, dy: -16 },                        // left collar
          { d: 'M600 86 L580 100 L585 120 L610 101 Z', dx: -262, dy: 46 },                         // right collar
        ];
        this.cuts = PIECES.map((pc) => el('path', { d: pc.d, transform: `translate(${pc.dx} ${pc.dy})`, fill: 'none', stroke: 'var(--cs-cut)', 'stroke-width': 1.6, 'stroke-dasharray': '5 4' }, g));
        this.pieces = PIECES.map((pc) => ({ ...pc, node: el('path', { d: pc.d, fill: `url(#${uid}-cloth)`, stroke: 'var(--cs-edge)', 'stroke-width': 1 }, g) }));
        this.stitches = el('g', { fill: 'none', stroke: 'var(--secondary)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, g);
        ['M527 96 L522 140', 'M633 96 L638 140', 'M524 145 L520 294', 'M636 145 L640 294', 'M580 102 V296', 'M521 294 H639']
          .forEach((d) => el('path', { d }, this.stitches));
        this.buttons = [125, 160, 195, 230, 265].map((y) => el('circle', { cx: 586, cy: y, r: 3.2, fill: 'var(--cs-cotton)', stroke: 'var(--secondary)', 'stroke-width': 1 }, g));
      },
      render(p) {
        const cut = seg(p, 0, 0.2), lift = seg(p, 0.2, 0.28), move = ease(seg(p, 0.28, 0.66));
        this.cuts.forEach((c) => {
          c.style.opacity = cut > 0 ? 1 - lift : 0;
          c.setAttribute('stroke-dashoffset', 60 * (1 - cut));
        });
        this.fabric.style.opacity = 1 - 0.7 * lift - 0.25 * seg(p, 0.66, 0.8);
        this.pieces.forEach((pc) => {
          pc.node.style.opacity = lift;
          pc.node.setAttribute('transform', `translate(${pc.dx * (1 - move)} ${pc.dy * (1 - move)})`);
        });
        this.stitches.style.opacity = seg(p, 0.68, 0.84);
        this.buttons.forEach((b, i) => {
          const s = ease(seg(p, 0.84 + i * 0.025, 0.9 + i * 0.025));
          b.setAttribute('transform', `translate(586 ${b.getAttribute('cy')}) scale(${s}) translate(-586 ${-b.getAttribute('cy')})`);
        });
      },
    };

    const SCENES = [
      { name: 'Fiber', seconds: 5, scene: plant, caption: 'A cotton boll bursts open. Its fluffy lint is made of short staple fibers.' },
      { name: 'Yarn', seconds: 4, scene: spin, caption: 'The fibers are drawn out and twisted together (spun) into a continuous yarn.' },
      { name: 'Fabric', seconds: 5, scene: weave, caption: 'The yarn is woven: crosswise weft threads pass over and under lengthwise warp threads.' },
      { name: 'Shirt', seconds: 5, scene: sew, caption: 'Pattern pieces are cut from the fabric and sewn into a shirt.' },
    ];
    let acc = 0;
    SCENES.forEach((s) => { s.start = acc; acc += s.seconds; s.g = el('g', { class: 'cs-scene' }); s.scene.build(s.g); });
    const TOTAL = acc;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const caption = root.querySelector('.cs-caption');
    const playBtn = root.querySelector('[data-cs-play]');
    const stepBtns = SCENES.map((s, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = `${i + 1}. ${s.name}<span class="cs-bar"></span>`;
      b.addEventListener('click', () => {
        if (reduceMotion) { t = s.start + s.seconds - 0.001; renderAt(t); }
        else { t = s.start; play(); }
      });
      root.querySelector('.cs-steps').appendChild(b);
      return b;
    });

    let t = 0, playing = false, last = null, frame = null, current = -1;

    function renderAt(time) {
      let i = SCENES.findIndex((s) => time < s.start + s.seconds);
      if (i === -1) i = SCENES.length - 1;
      const s = SCENES[i];
      s.scene.render(clamp((time - s.start) / s.seconds));
      if (i !== current) {
        SCENES.forEach((x, k) => (x.g.style.opacity = k === i ? 1 : 0));
        stepBtns.forEach((b, k) => (k === i ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current')));
        caption.textContent = s.caption;
        current = i;
      }
      stepBtns.forEach((b, k) => {
        const sc = SCENES[k];
        b.querySelector('.cs-bar').style.width = `${100 * clamp((time - sc.start) / sc.seconds)}%`;
      });
    }

    function tick(now) {
      if (last !== null) t = Math.min(TOTAL, t + (now - last) / 1000);
      last = now;
      renderAt(t);
      if (t >= TOTAL) return stop();
      frame = requestAnimationFrame(tick);
    }
    function play() {
      if (t >= TOTAL) t = 0;
      playing = true; last = null;
      playBtn.textContent = 'Pause';
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(tick);
    }
    function stop() {
      playing = false;
      cancelAnimationFrame(frame);
      playBtn.textContent = t >= TOTAL ? 'Replay' : 'Play';
    }
    playBtn.addEventListener('click', () => (playing ? stop() : play()));

    if (reduceMotion) {
      // No animation: each step button shows that scene's finished state
      t = SCENES[0].seconds - 0.001;
      renderAt(t);
      playBtn.hidden = true;
    } else {
      renderAt(0);
      const io = new IntersectionObserver((entries) => {
        if (entries.some((e) => e.isIntersecting)) { io.disconnect(); play(); }
      }, { threshold: 0.5 });
      io.observe(svg);
    }
  })();
</script>
